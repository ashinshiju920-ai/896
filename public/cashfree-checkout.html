<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Material Checkout</title>
  <style>
    body {
      margin: 0;
      padding: 2rem 1rem;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      display: flex;
      justify-content: center;
    }
    .checkout-box {
      max-width: 650px;
      width: 100%;
      background: #fff;
      border-radius: 14px;
      padding: 2rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      text-align: center;
    }
    .qr-container {
      background: #f1f5f9;
      display: inline-block;
      padding: 1.25rem;
      border-radius: 12px;
      margin: 1.5rem 0;
    }
    .qr-container img {
      width: 200px;
      height: 200px;
      border-radius: 8px;
      border: 3px solid #fff;
    }
    .btn-pay {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 0.9rem;
      background: #6366f1;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 2rem;
    }
    iframe {
      width: 100%;
      height: 700px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div class="checkout-box">
    <h2>Study Materials Checkout</h2>
    <p style="color: #64748b; font-size: 0.9rem;">Form: study-portal-buy (ID: 314009172)</p>

    <!-- QR Code -->
    <div class="qr-container">
      <p style="margin: 0 0 0.5rem; font-weight: 600; font-size: 0.9rem;">Scan to Pay</p>
      <img 
        src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=https%3A%2F%2Fpayments.cashfree.com%2Fforms%2Fstudy-portal-buy" 
        alt="Payment QR Code" 
      />
    </div>

    <!-- Direct Payment Button -->
    <a href="https://payments.cashfree.com/forms/study-portal-buy" target="_blank" rel="noopener noreferrer" class="btn-pay">
      Open Payment Page in New Tab
    </a>

    <!-- Embedded Form -->
    <iframe 
      src="https://payments.cashfree.com/forms/study-portal-buy" 
      title="Cashfree Form"
      allow="payment"
    ></iframe>
  </div>

</body>
</html>
